[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polski-audytor-wcag"
version = "0.1.0"
description = "Polski audytor dostępności cyfrowej (WCAG 2.1 AA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "axe-playwright-python>=0.1.8",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",       # sterownik PostgreSQL (docker-compose)
    "alembic>=1.13",              # migracje bazy
    "fastapi>=0.115",             # REST API (F21)
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",         # kolejka skanów (F4)
    "truststore>=0.9",  # SSL przez magazyn certyfikatów systemu (niepełne łańcuchy na stronach urzędów)
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.0",                # TestClient FastAPI (starlette)
    "ruff>=0.6",
]

[project.scripts]
audytor-crawl = "audytor.crawler.cli:main"
audytor-scan = "audytor.skan.cli:main"
audytor-api = "audytor.api.__main__:main"
audytor-fokus = "audytor.fokus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"audytor.axe" = ["locales/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "browser: test uruchamia prawdziwą przeglądarkę Chromium (Playwright); pomijany, gdy jej brak",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W – styl (pycodestyle), F – błędy (pyflakes: nieużyte importy, niezdefiniowane nazwy).
# Kolejne reguły (np. I – sortowanie importów) dodajemy po ustaleniu w zespole.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]   # długie linie z HTML-em stron testowych
