[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polski-audytor-wcag"
version = "0.1.0"
description = "Polski audytor dostępności cyfrowej (WCAG 2.1 AA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "axe-playwright-python>=0.1.8",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
audytor-crawl = "audytor.crawler.cli:main"
audytor-scan = "audytor.skan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"audytor.axe" = ["locales/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "browser: test uruchamia prawdziwą przeglądarkę Chromium (Playwright); pomijany, gdy jej brak",
]
