# Migracje bazy (Alembic). Adres bazy: zmienna AUDYTOR_DB_URL (patrz migrations/env.py).
#   alembic upgrade head                       – utwórz / zaktualizuj tabele
#   alembic revision --autogenerate -m "opis"  – nowa migracja po zmianie src/audytor/db/models.py
#   alembic check                              – czy modele i migracje są zgodne (uruchamiane w CI)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
